services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ntsa
      POSTGRES_PASSWORD: ntsa_local
      POSTGRES_DB: ntsa
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["ntsa_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ntsa"]
      interval: 5s
      retries: 10
volumes:
  ntsa_data:
